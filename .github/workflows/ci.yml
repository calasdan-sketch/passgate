name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest build twine ruff hypothesis
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: |
          passgate --version
          python -m passgate --version
          passgate plan --rate 0.95 --threshold 0.9
          passgate compare --candidate 93/100 --baseline 85/100 --test fisher --format markdown
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check --strict dist/*
      - name: Install the built wheel into a fresh venv and run the quick start
        run: python scripts/smoke_wheel.py "dist/*.whl"
