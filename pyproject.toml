[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "passgate"
version = "0.3.0"
description = "Statistical pass^N gate: require an eval candidate to clear a Wilson-bound bar on every round, not just on average"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "calasdan-sketch" }]
keywords = ["evals", "llm", "reliability", "wilson", "statistics", "gate", "regression", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/passgate"
Issues = "https://github.com/calasdan-sketch/passgate/issues"
Changelog = "https://github.com/calasdan-sketch/passgate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# dev only: scipy and statsmodels are test oracles, numpy runs benchmarks/bench_gates.py; none is a runtime dependency
dev = ["pytest", "ruff", "scipy", "statsmodels", "numpy"]

[project.scripts]
passgate = "passgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
passgate = ["py.typed"]

[tool.ruff]
extend-exclude = [".venv-sop", "build", "dist"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
